name: Weekly AI Winsight

on:
  # Triggered by an external cron-job.org job hitting the workflow_dispatch
  # API on Fridays — GitHub's own `schedule:` trigger was unreliable (runs
  # delayed by hours or dropped), same reason PromoLeads Crawl uses it too.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ai-winsight
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install Cursor Agent CLI
        run: curl https://cursor.com/install -fsS | bash

      - name: Create .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Generate weekly Winsight
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 weekly_insight.py

      - name: Persist weekly Winsight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_insight.json
          git diff --staged --quiet || git commit -m "chore: update weekly AI Winsight [skip ci]"
          git push
